name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.3 liblua5.3-dev graphviz google-perftools golang-go

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Unit Tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Run Example & Test Visualization Tools
      run: |
        cd test
        lua test_cpu.lua || lua5.3 test_cpu.lua
        lua test_mem.lua || lua5.3 test_mem.lua
        cd ../tools
        ./show.sh ../test
